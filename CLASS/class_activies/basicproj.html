 <!DOCTYPE html>
<html>
<head>
    <title>ATM Machine</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .atm-container {
            width: 350px;
            background-color: #34495e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
        }

        .atm-container h2 {
            margin-bottom: 15px;
        }

        .screen {
            background-color: #1abc9c;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: black;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #e67e22;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div class="atm-container">
        <h2>ATM Machine</h2>

        <div class="screen">
            <p>Welcome!</p>
            <p>Select Your Transaction</p>
        </div>

        <div class="buttons">
            <button>Check Balance</button>
            <button>Deposit</button>
            <button>Withdraw</button>
            <button>Exit</button>
        </div>
    </div>

</body>
</html>
