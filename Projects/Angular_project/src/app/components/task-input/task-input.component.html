<div class="input-card">
  <div class="main-input">
    <input 
      type="text" 
      [(ngModel)]="taskTitle" 
      (keyup.enter)="addTask()"
      placeholder="What needs to be done?"
    />
    <button class="star-btn" [class.active]="isImportant()" (click)="toggleImportant()" title="Mark as important">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" [attr.fill]="isImportant() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
    </button>
  </div>

  <div class="controls">
    <div class="selectors">
      <select [(ngModel)]="priority">
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
      </select>

      <select [(ngModel)]="category">
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <button class="add-btn" (click)="addTask()" [disabled]="!taskTitle().trim()">
      Add Task
    </button>
  </div>
</div>
