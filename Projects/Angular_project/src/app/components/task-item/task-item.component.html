<div class="task-item" [class.completed]="task.completed" [class.editing]="isEditing()" [style.border-left-color]="'var(--priority-' + task.priority + ')'">
  <div class="checkbox-container" (click)="onToggle()">
    <div class="checkbox">
      @if (task.completed) {
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      }
    </div>
  </div>
  
  <div class="content">
    @if (isEditing()) {
      <input 
        [(ngModel)]="editTitle" 
        (keyup.enter)="saveEdit()" 
        (keyup.escape)="cancelEdit()"
        (blur)="saveEdit()"
        autofocus
      />
    } @else {
      <div class="title-row">
        <span class="task-title" (click)="onToggle()">{{ task.title }}</span>
        <span class="category-badge">{{ task.category }}</span>
      </div>
      <div class="meta-row">
        <span class="time">{{ getRelativeTime() }}</span>
        <span class="priority-label" [style.color]="'var(--priority-' + task.priority + ')'">
          {{ task.priority | titlecase }}
        </span>
      </div>
    }
  </div>

  <div class="actions">
    <button class="action-btn important" [class.active]="task.important" (click)="onToggleImportant()" title="Mark as important">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="task.important ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
    </button>
    
    <button class="action-btn edit" (click)="startEdit()" title="Edit task">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
    </button>

    <button class="action-btn delete" (click)="onDelete()" title="Delete task">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
  </div>
</div>
