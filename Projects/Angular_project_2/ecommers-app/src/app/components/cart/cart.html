<h2 class="cart-title">My Cart</h2>

<div *ngIf="items.length===0" class="empty-cart">
  <p> Your cart is empty</p>

  <a routerLink="/">
    Continue Shopping
  </a>
</div>



<div class="cart-container">

<div class="cart-card"
*ngFor="let item of items; let i=index">

<h3>{{item.name}}</h3>

<p>₹{{item.price}}</p>

<button (click)="removeItem(i)">
Remove
</button>

</div>

</div>

<div class="total-box">
<h2>Total: ₹{{getTotal()}}</h2>
</div>
